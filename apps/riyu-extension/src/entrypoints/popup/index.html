<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiYU</title>
  </head>
  <body>
    <main>
      <h1>RiYU</h1>
      <p>開いている雀魂の牌譜をローカル解析へ送ります。</p>
      <label>観戦席
        <select id="observer">
          <option value="0">0 / East</option>
          <option value="1">1 / South</option>
          <option value="2">2 / West</option>
          <option value="3">3 / North</option>
        </select>
      </label>
      <label>RiYU URL
        <input id="server" value="http://127.0.0.1:8787" spellcheck="false" />
      </label>
      <button id="send" type="button">RiYUで解析</button>
      <p id="status" role="status"></p>
      <details>
        <summary>データの扱い</summary>
        <p>ボタンを押したときだけ、表示中の牌譜を指定したloopback URLへ送信します。</p>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
