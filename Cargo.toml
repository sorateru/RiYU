[workspace]
members = [
    "engine/core",
    "engine/data-lake",
    "bindings/python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
